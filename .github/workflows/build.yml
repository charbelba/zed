name: Build Rust Application (Multi-OS)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
         include:
          - os: ubuntu-latest
            artifact_name: app-linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact_name: app-windows
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            artifact_name: app-macos
            target: x86_64-apple-darwin
            


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install X11 and ALSA dev libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libasound2-dev

        
      - name: Shorten Cargo home on Windows
        if: runner.os == 'Windows'
        run: |
          mkdir C:\cargo
          echo "CARGO_HOME=C:\cargo" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add macOS target
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/*.exe artifacts/
          else
            cp target/${{ matrix.target }}/release/* artifacts/
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/

